[package]
name = "mitigata-ingest"
version = "0.1.0"
edition = "2021"
authors = ["Mitigata Security Engineering <sec-ops@mitigata.internal>"]
description = "Ultra high-performance streaming log parser and DuckDB bulk ingestion CLI"

[dependencies]
# Embedded vectorized DuckDB engine
duckdb = { version = "1.1.1", features = ["bundled"] }

# Serialization and high-speed JSON/JSONL deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optimized regex engine for IP and syslog timestamp matching
regex = "1.10"

# Date and time parsing
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
